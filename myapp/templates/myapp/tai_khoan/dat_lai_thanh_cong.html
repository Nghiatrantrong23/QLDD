<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt lại mật khẩu thành công - WebGIS QLĐD</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --primary-blue: #3b82f6;
            --primary-green: #10b981;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg-gradient);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .ambient-blob {
            position: absolute;
            width: 400px;
            height: 400px;
            filter: blur(120px);
            border-radius: 50%;
            z-index: 0;
            opacity: 0.12;
            animation: float 20s infinite alternate;
        }
        .blob-1 { background: var(--primary-green); top: -80px; left: -80px; }
        .blob-2 { background: #6366f1; bottom: -120px; right: -80px; animation-delay: -6s; }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(70px, 50px) scale(1.2); }
        }

        .card {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 460px;
            padding: 50px 45px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
            animation: slideUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Animated success circle */
        .success-wrapper {
            position: relative;
            width: 110px;
            height: 110px;
            margin: 0 auto 28px;
        }

        .success-circle {
            width: 110px;
            height: 110px;
            background: linear-gradient(135deg, rgba(16,185,129,0.15), rgba(16,185,129,0.05));
            border: 2px solid rgba(16, 185, 129, 0.5);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: popIn 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) 0.2s both;
        }
        .success-circle i { font-size: 44px; color: var(--primary-green); }

        .ring {
            position: absolute;
            inset: -8px;
            border-radius: 50%;
            border: 2px solid transparent;
            border-top-color: rgba(16, 185, 129, 0.5);
            border-right-color: rgba(16, 185, 129, 0.2);
            animation: spinRing 3s linear infinite;
        }
        .ring-2 {
            inset: -16px;
            border-top-color: rgba(16, 185, 129, 0.2);
            border-right-color: transparent;
            animation: spinRing 5s linear infinite reverse;
        }

        @keyframes spinRing { to { transform: rotate(360deg); } }
        @keyframes popIn {
            from { transform: scale(0.5); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        h1 { color: var(--text-main); font-size: 26px; font-weight: 700; margin-bottom: 12px; }

        .subtitle {
            color: var(--text-muted);
            font-size: 15px;
            line-height: 1.7;
            margin-bottom: 36px;
        }
        .subtitle strong { color: #6ee7b7; }

        .btn-login {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            text-decoration: none;
            border-radius: 14px;
            padding: 16px 28px;
            font-size: 16px;
            font-weight: 600;
            font-family: inherit;
            transition: all 0.3s;
            box-shadow: 0 10px 20px -5px rgba(16, 185, 129, 0.4);
            margin-bottom: 16px;
        }
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 25px -5px rgba(16, 185, 129, 0.5);
        }

        .confetti {
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 2px;
            animation: confettiFall linear forwards;
        }

        @keyframes confettiFall {
            0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(600px) rotate(720deg); opacity: 0; }
        }

        .timer-note {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 4px;
        }
        #countdown { color: #6ee7b7; font-weight: 700; }

        @media (max-width: 480px) {
            .card { padding: 40px 25px; border-radius: 20px; margin: 16px; }
        }
    </style>
</head>
<body>
    <div class="ambient-blob blob-1"></div>
    <div class="ambient-blob blob-2"></div>

    <div class="card" id="main-card">
        <div class="success-wrapper">
            <div class="ring"></div>
            <div class="ring ring-2"></div>
            <div class="success-circle">
                <i class="fas fa-check"></i>
            </div>
        </div>

        <h1>Mật khẩu đã được đặt lại!</h1>
        <p class="subtitle">
            Tuyệt vời! Mật khẩu của bạn đã được <strong>cập nhật thành công</strong>.
            Bây giờ bạn có thể đăng nhập bằng mật khẩu mới.
        </p>

        <a href="{% url 'dang_nhap' %}" class="btn-login" id="btn-login">
            <i class="fas fa-sign-in-alt"></i> Đăng nhập ngay
        </a>

        <p class="timer-note">Tự động chuyển hướng sau <span id="countdown">5</span> giây...</p>
    </div>

    <script>
        // Confetti effect
        const colors = ['#10b981', '#3b82f6', '#8b5cf6', '#f59e0b', '#6ee7b7'];
        const card = document.getElementById('main-card');

        function createConfetti() {
            for (let i = 0; i < 30; i++) {
                setTimeout(() => {
                    const el = document.createElement('div');
                    el.className = 'confetti';
                    el.style.left = Math.random() * 100 + 'vw';
                    el.style.top = '0px';
                    el.style.background = colors[Math.floor(Math.random() * colors.length)];
                    el.style.width = (Math.random() * 8 + 4) + 'px';
                    el.style.height = (Math.random() * 8 + 4) + 'px';
                    el.style.animationDuration = (Math.random() * 2 + 2) + 's';
                    el.style.animationDelay = Math.random() * 0.5 + 's';
                    document.body.appendChild(el);
                    setTimeout(() => el.remove(), 4000);
                }, i * 50);
            }
        }
        createConfetti();

        // Countdown redirect
        let count = 5;
        const countEl = document.getElementById('countdown');
        const interval = setInterval(() => {
            count--;
            countEl.textContent = count;
            if (count <= 0) {
                clearInterval(interval);
                window.location.href = "{% url 'dang_nhap' %}";
            }
        }, 1000);
    </script>
</body>
</html>
