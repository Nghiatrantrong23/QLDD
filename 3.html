{% block js_them %}
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
<script>
    /* ============================================================
       QLDD GIS — cong_cu_v2 JavaScript (đã sửa lỗi)
       Các bug đã fix:
         #1 - Frontend gửi đúng field name cho backend
         #2 - displayIntersectResult nhận vi_pham_geojson đúng định dạng
         #3 - Màu thửa đất dùng mã loại đất (ODT/ONT...) không phải display text
         #4 - runBufferParcel gửi đúng field 'ma_thua_dat' tới api_buffer
       ============================================================ */

    // ── 1. CONFIG ────────────────────────────────────────────────
    const GIS_CONFIG = {
        apiBuffer: "{% url 'api_buffer' %}",
        apiIntersect: "{% url 'api_intersect' %}",
        apiGeoJson: "{% url 'api_thua_dat_geojson' %}",
        apiQuyHoach: "{% url 'api_vung_quy_hoach_geojson' %}",
        apiLichSu: "{% url 'api_chi_tiet_lich_su' pk=0 %}".replace('/0/', '/'),
        apiStats: "{% url 'api_thong_ke' %}",
        csrfToken: "{{ csrf_token }}",
        centerLat: {{ center_lat|default: "16.0544" }},
    centerLng: { { center_lng |default: "108.2208" } },
    defaultZoom: { { default_zoom |default: "13" } },
};

    // ── 2. BASEMAPS ──────────────────────────────────────────────
    const BASEMAPS = {
        voyager: L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', { attribution: '© CartoDB', maxZoom: 19 }),
        osm: L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OSM', maxZoom: 19 }),
        dark: L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { attribution: '© CartoDB', maxZoom: 19 }),
        satellite: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { attribution: '© ESRI', maxZoom: 19 }),
        topo: L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', { attribution: '© OpenTopoMap', maxZoom: 17 }),
    };

    // ── 3. MÀU LOẠI ĐẤT  (BUG FIX #3 – dùng MÃ, không dùng text) ─
    const LAND_COLORS = {
        ODT: '#ff6b6b', ONT: '#ff9f43', CLN: '#4ecdc4',
        LUA: '#55efc4', TSC: '#74b9ff', DGT: '#a29bfe',
        SKC: '#fd79a8', DDT: '#b2bec3',
    };
    // api_danh_sach_thua_dat trả loai_dat = display text → cần map ngược
    const LAND_TEXT_TO_CODE = {
        'Đất ở đô thị': 'ODT',
        'Đất ở nông thôn': 'ONT',
        'Đất cây lâu năm': 'CLN',
        'Đất trồng lúa': 'LUA',
        'Đất trụ sở cơ quan': 'TSC',
        'Đất giao thông': 'DGT',
        'Đất sản xuất kinh doanh': 'SKC',
        'Đất phi nông nghiệp khác': 'DDT',
    };
    function getLandColor(val) {
        if (!val) return '#94a3b8';
        // Thử tra thẳng mã trước
        if (LAND_COLORS[val]) return LAND_COLORS[val];
        // Nếu là display text thì map về mã
        const code = LAND_TEXT_TO_CODE[val];
        return code ? (LAND_COLORS[code] || '#94a3b8') : '#94a3b8';
    }

    // ── 4. MAP ───────────────────────────────────────────────────
    const map = L.map('map', {
        center: [GIS_CONFIG.centerLat, GIS_CONFIG.centerLng],
        zoom: GIS_CONFIG.defaultZoom,
        zoomControl: false,
    });
    BASEMAPS.voyager.addTo(map);
    let currentBasemap = BASEMAPS.voyager;
    L.control.zoom({ position: 'bottomright' }).addTo(map);

    // ── 5. STATE ─────────────────────────────────────────────────
    const state = {
        activeTool: 'buffer-click',
        bufferMarker: null,
        bufferLayer: null,
        resultLayer: null,
        thuaDatLayer: null,
        quyHoachLayer: null,
        drawLayer: null,
        drawnPolygon: null,
        lastResults: null,
        isMeasuring: false,
        isDrawing: false,
        layerVisible: {
            'thua-dat': true,
            'quy-hoach': true,
            'buffer-result': true,
            'vi-pham': true,
            'labels': false,
        },
        opacity: { 'thua-dat': 0.5, 'quy-hoach': 0.12 },
    };

    // ── 6. TẢI DỮ LIỆU NỀN ──────────────────────────────────────
    async function loadThuaDat() {
        try {
            const res = await fetch(GIS_CONFIG.apiGeoJson);
            const data = await res.json();
            if (state.thuaDatLayer) map.removeLayer(state.thuaDatLayer);
            state.thuaDatLayer = L.geoJSON(data, {
                style: f => {
                    const loai = f.properties.loai_dat || f.properties.loai_dat_hien_trang || '';
                    const color = getLandColor(loai);
                    return { color, weight: 1.5, fillOpacity: state.opacity['thua-dat'], fillColor: color };
                },
                onEachFeature: (f, layer) => {
                    const p = f.properties;
                    const loaiText = p.loai_dat || p.loai_dat_hien_trang || '—';
                    layer.bindPopup(`
          <div style="font-family:'Be Vietnam Pro',sans-serif;min-width:200px">
            <div style="font-weight:700;font-size:13px;margin-bottom:8px">${p.ma_thua || p.ma_thua_dat || 'N/A'}</div>
            <table style="font-size:12px;width:100%;border-collapse:collapse">
              <tr><td style="color:#555;padding:3px 0">Loại đất</td><td style="font-weight:600">${loaiText}</td></tr>
              <tr><td style="color:#555;padding:3px 0">Diện tích</td><td>${p.dien_tich ? Number(p.dien_tich).toLocaleString() + ' m²' : '—'}</td></tr>
              <tr><td style="color:#555;padding:3px 0">Địa chỉ</td><td>${p.dia_chi || '—'}</td></tr>
              <tr><td style="color:#555;padding:3px 0">Chủ SD</td><td>${p.chu_su_dung || '—'}</td></tr>
            </table>
            <div style="margin-top:10px;display:flex;gap:6px">
              <a href="/ho-so-dat/${p.id}/" style="flex:1;padding:5px 8px;background:#2563eb;color:#fff;border-radius:5px;text-align:center;text-decoration:none;font-size:11px;font-weight:600">Chi tiết</a>
              <a href="/ho-so-dat/${p.id}/chinh-sua/" style="flex:1;padding:5px 8px;background:#f3f4f6;color:#374151;border-radius:5px;text-align:center;text-decoration:none;font-size:11px">Chỉnh sửa</a>
            </div>
          </div>
        `);
                    layer.on('mouseover', () => layer.setStyle({ weight: 2.5, fillOpacity: Math.min(state.opacity['thua-dat'] + 0.2, 1) }));
                    layer.on('mouseout', () => state.thuaDatLayer && state.thuaDatLayer.resetStyle(layer));
                },
            });
            if (state.layerVisible['thua-dat']) state.thuaDatLayer.addTo(map);
        } catch (e) {
            console.error('Lỗi tải thửa đất:', e);
            showToast('Lỗi tải dữ liệu', 'Không thể tải lớp thửa đất', 'error');
        }
    }

    async function loadQuyHoach() {
        try {
            const res = await fetch(GIS_CONFIG.apiQuyHoach);
            const data = await res.json();
            if (state.quyHoachLayer) map.removeLayer(state.quyHoachLayer);
            state.quyHoachLayer = L.geoJSON(data, {
                style: () => ({
                    color: '#f59e0b', weight: 2,
                    fillColor: '#f59e0b', fillOpacity: state.opacity['quy-hoach'],
                    dashArray: '6,4',
                }),
                onEachFeature: (f, layer) => {
                    const p = f.properties;
                    layer.bindTooltip(`<b>${p.ten_vung || 'Vùng QH'}</b><br>${p.loai_qh || ''}`, { sticky: true });
                },
            });
            if (state.layerVisible['quy-hoach']) state.quyHoachLayer.addTo(map);
        } catch (e) {
            console.error('Lỗi tải quy hoạch:', e);
            showToast('Lỗi tải dữ liệu', 'Không thể tải lớp quy hoạch', 'error');
        }
    }

    // ── 7. CLICK BẢN ĐỒ → ĐẶT TÂM BUFFER ───────────────────────
    map.on('click', function (e) {
        if (state.isDrawing || state.isMeasuring) return;
        if (state.activeTool !== 'buffer-click') return;
        const { lat, lng } = e.latlng;
        if (state.bufferMarker) map.removeLayer(state.bufferMarker);
        state.bufferMarker = L.circleMarker([lat, lng], {
            radius: 6, color: '#2563eb', fillColor: '#2563eb', fillOpacity: 1, weight: 2,
        }).addTo(map).bindPopup(`Tâm buffer<br>${lat.toFixed(5)}, ${lng.toFixed(5)}`);
        setStatus('Đã chọn tâm buffer — Nhấn "Thực hiện Buffer" để phân tích', 'ready');
    });

    // ── 8. BUFFER TỪ ĐIỂM CLICK  (BUG FIX #1) ──────────────────
    async function runBufferClick() {
        if (!state.bufferMarker) {
            showToast('Chưa chọn tâm', 'Vui lòng click trên bản đồ để chọn điểm tâm', 'warning');
            return;
        }
        const { lat, lng } = state.bufferMarker.getLatLng();
        const radius = parseInt(document.getElementById('radius-val').value) || 300;
        const checkType = document.getElementById('check-type').value;
        const loaiDat = document.getElementById('loai-dat-filter').value;

        showLoading('Đang tạo vùng đệm...', `Bán kính ${radius} m`);
        setStatus('Đang phân tích buffer...', 'busy');
        try {
            // BUG FIX #1: gửi đúng field 'lat','lng' khớp với backend api_buffer
            const res = await apiFetch(GIS_CONFIG.apiBuffer, {
                lat,
                lng,
                ban_kinh: radius,
                kiem_tra: checkType,
                loai_dat: loaiDat,
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
            displayBufferResult(data, radius);
            addHistoryEntry('Buffer điểm', `R=${radius}m · ${data.so_thua_trong_vung || 0} thửa`, data.so_vi_pham > 0 ? 'vp' : 'ok');
        } catch (e) {
            showToast('Lỗi phân tích', e.message, 'error');
            setStatus('Lỗi — ' + e.message, 'error');
        } finally { hideLoading(); }
    }

    // ── 9. BUFFER TỪ THỬA ĐẤT  (BUG FIX #4) ────────────────────
    async function runBufferParcel() {
        const maThua = document.getElementById('ma-thua-input').value.trim();
        const radius = parseInt(document.getElementById('radius-parcel').value) || 300;
        const checkTp = document.getElementById('check-type-parcel').value;

        if (!maThua) { showToast('Thiếu thông tin', 'Vui lòng nhập mã thửa đất', 'warning'); return; }

        showLoading('Buffer từ thửa đất...', maThua);
        setStatus('Đang tạo buffer từ thửa ' + maThua, 'busy');
        try {
            // BUG FIX #4: đúng field 'ma_thua_dat' khớp với backend api_buffer
            const res = await apiFetch(GIS_CONFIG.apiBuffer, {
                ma_thua_dat: maThua,
                ban_kinh: radius,
                kiem_tra: checkTp,
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
            displayBufferResult(data, radius);
            addHistoryEntry('Buffer thửa', `${maThua} · R=${radius}m`, data.so_vi_pham > 0 ? 'vp' : 'ok');
        } catch (e) {
            showToast('Lỗi', e.message, 'error');
            setStatus('Lỗi — ' + e.message, 'error');
        } finally { hideLoading(); }
    }

    // ── 10. KIỂM TRA VI PHẠM ────────────────────────────────────
    async function runIntersect() {
        const phamVi = document.getElementById('pham-vi').value;
        const vungQH = document.getElementById('vung-qh-filter').value;

        if (phamVi === 'area' && !state.drawnPolygon) {
            showToast('Chưa vẽ vùng', 'Dùng nút ✏ để vẽ vùng kiểm tra trên bản đồ', 'warning');
            return;
        }

        showLoading('Kiểm tra vi phạm quy hoạch...', 'Đang so sánh với vùng quy hoạch');
        setStatus('Đang kiểm tra vi phạm...', 'busy');
        try {
            const body = {
                pham_vi: phamVi,
                vung_qh_id: vungQH,
            };
            if (phamVi === 'area' && state.drawnPolygon) {
                body.area_geojson = JSON.stringify(state.drawnPolygon.toGeoJSON().geometry);
            }
            const res = await apiFetch(GIS_CONFIG.apiIntersect, body);
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
            displayIntersectResult(data);
            addHistoryEntry('Kiểm tra vi phạm', `${data.so_vi_pham || 0}/${data.tong_kiem_tra || 0} thửa`, data.so_vi_pham > 0 ? 'vp' : 'ok');
        } catch (e) {
            showToast('Lỗi', e.message, 'error');
            setStatus('Lỗi — ' + e.message, 'error');
        } finally { hideLoading(); }
    }

    // ── 11. THỐNG KÊ ─────────────────────────────────────────────
    async function runStats() {
        const nhomTheo = document.querySelector('#params-stats .field-select')?.value || 'loai_dat';
        showLoading('Đang tính thống kê...', nhomTheo);
        setStatus('Đang tính thống kê...', 'busy');
        try {
            const res = await apiFetch(GIS_CONFIG.apiStats, { nhom_theo: nhomTheo });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
            renderStatsPanel(data);
            showToast('Thống kê hoàn thành', `${data.tong_so_thua || 0} thửa`, 'success');
            setStatus(`Thống kê xong — ${data.tong_so_thua || 0} thửa`, 'ready');
            switchToResultsTab();
            addHistoryEntry('Thống kê', `Nhóm: ${nhomTheo}`, 'ok');
        } catch (e) {
            renderStatsFallback();
            showToast('API thống kê chưa sẵn sàng', e.message, 'warning');
            setStatus('Thống kê offline', 'ready');
        } finally { hideLoading(); }
    }

    function renderStatsPanel(data) {
        const rows = (data.rows || []).map(r => `
    <div class="rc-row">
      <div class="rc-label">
        <span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${getLandColor(r.ma)};margin-right:6px;vertical-align:middle"></span>
        ${r.ten || r.ma}
      </div>
      <div class="rc-value">${r.tong_dien_tich ? Number(r.tong_dien_tich).toLocaleString() + ' m²' : '—'} &nbsp;<span style="color:var(--text-dim);font-weight:400">(${r.so_thua || 0} thửa)</span></div>
    </div>`).join('');
        document.getElementById('results-container').innerHTML = `
    <div class="result-card">
      <div class="rc-title"><i class="fa fa-chart-pie" style="color:var(--violet)"></i> Thống kê diện tích</div>
      ${rows || '<div class="rc-row"><div class="rc-label" style="color:var(--text-dim)">Không có dữ liệu</div></div>'}
      <div class="result-actions"><button onclick="exportExcel('stats')">⬇ Xuất Excel</button></div>
    </div>`;
    }

    function renderStatsFallback() {
        document.getElementById('results-container').innerHTML = `
    <div class="result-card">
      <div class="rc-title"><i class="fa fa-chart-pie" style="color:var(--violet)"></i> Thống kê (cần cấu hình API)</div>
      <div style="padding:12px 0;font-size:11px;color:var(--text-dim);text-align:center">
        <i class="fa fa-circle-info"></i> Thêm URL <code>api_thong_ke</code> vào urls.py
      </div>
    </div>`;
        switchToResultsTab();
    }

    // ── 12. MẬT ĐỘ ──────────────────────────────────────────────
    async function runDensity() {
        showLoading('Đang tạo bản đồ mật độ...', 'Đang tải dữ liệu');
        setStatus('Đang tạo heatmap...', 'busy');
        try {
            const res = await fetch(GIS_CONFIG.apiGeoJson);
            const data = await res.json();
            if (state.resultLayer) map.removeLayer(state.resultLayer);
            const points = [];
            (data.features || []).forEach(f => {
                const g = f.geometry;
                if (!g) return;
                if (g.type === 'MultiPolygon') {
                    const c = g.coordinates[0][0];
                    const cx = c.reduce((s, p) => s + p[0], 0) / c.length;
                    const cy = c.reduce((s, p) => s + p[1], 0) / c.length;
                    points.push([cy, cx]);
                } else if (g.type === 'Polygon') {
                    const c = g.coordinates[0];
                    const cx = c.reduce((s, p) => s + p[0], 0) / c.length;
                    const cy = c.reduce((s, p) => s + p[1], 0) / c.length;
                    points.push([cy, cx]);
                } else if (g.type === 'Point') {
                    points.push([g.coordinates[1], g.coordinates[0]]);
                }
            });
            state.resultLayer = L.layerGroup(
                points.map(p => L.circleMarker(p, { radius: 10, color: 'transparent', fillColor: '#f43f5e', fillOpacity: 0.13, weight: 0 }))
            ).addTo(map);
            setStatus(`Heatmap — ${points.length} thửa`, 'ready');
            showToast('Bản đồ mật độ', `${points.length} thửa đất`, 'success');
            addHistoryEntry('Mật độ', `${points.length} điểm`, 'ok');
            document.getElementById('results-container').innerHTML = `
      <div class="result-card">
        <div class="rc-title"><i class="fa fa-fire" style="color:var(--violet)"></i> Mật độ thửa đất</div>
        <div class="rc-row"><div class="rc-label">Tổng điểm</div><div class="rc-value">${points.length} thửa</div></div>
        <div class="result-actions"><button onclick="clearAllResults()">🗑 Xóa lớp</button></div>
      </div>`;
            switchToResultsTab();
        } catch (e) {
            showToast('Lỗi', e.message, 'error');
        } finally { hideLoading(); }
    }

    // ── 13. CLIP ─────────────────────────────────────────────────
    async function runClip() {
        const vungSelect = document.querySelector('#params-clip .field-select');
        const vungId = vungSelect?.value || '';
        if (!vungId) { showToast('Chọn vùng', 'Vui lòng chọn vùng quy hoạch để clip', 'warning'); return; }
        showLoading('Đang clip dữ liệu...', 'Cắt theo ranh giới vùng');
        setStatus('Đang clip...', 'busy');
        try {
            const res = await apiFetch(GIS_CONFIG.apiIntersect, { pham_vi: 'all', vung_qh_id: vungId });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
            if (state.resultLayer) map.removeLayer(state.resultLayer);
            const gj = data.vi_pham_geojson;
            if (gj && gj.features && gj.features.length) {
                state.resultLayer = L.geoJSON(gj, {
                    style: f => {
                        const c = getLandColor(f.properties.loai_dat);
                        return { color: c, weight: 2, fillOpacity: 0.4, fillColor: c };
                    },
                }).addTo(map);
                if (state.resultLayer.getBounds().isValid()) map.fitBounds(state.resultLayer.getBounds(), { padding: [30, 30] });
            }
            const count = data.so_vi_pham || 0;
            setStatus(`Clip xong — ${count} thửa trong vùng`, 'ready');
            showToast('Clip hoàn thành', `${count} thửa trong vùng quy hoạch`, 'success');
            addHistoryEntry('Clip vùng QH', `${count} thửa`, 'ok');
            document.getElementById('results-container').innerHTML = `
      <div class="result-card">
        <div class="rc-title"><i class="fa fa-scissors" style="color:var(--gold)"></i> Kết quả Clip</div>
        <div class="rc-row"><div class="rc-label">Thửa trong vùng</div><div class="rc-value emerald">${count} thửa</div></div>
        <div class="result-actions">
          <button onclick="exportExcel('clip')">⬇ Xuất Excel</button>
          <button onclick="clearAllResults()">🗑 Xóa</button>
        </div>
      </div>`;
            switchToResultsTab();
        } catch (e) {
            showToast('Lỗi clip', e.message, 'error');
            setStatus('Lỗi clip', 'error');
        } finally { hideLoading(); }
    }

    // ── 14. HIỂN THỊ KẾT QUẢ BUFFER ────────────────────────────
    function displayBufferResult(data, radius) {
        if (state.bufferLayer) map.removeLayer(state.bufferLayer);
        if (state.resultLayer) map.removeLayer(state.resultLayer);

        // Vẽ vùng đệm
        const bufGj = data.buffer_geojson;
        if (bufGj) {
            state.bufferLayer = L.geoJSON(
                typeof bufGj === 'string' ? JSON.parse(bufGj) : bufGj,
                { style: { color: '#2563eb', weight: 2, dashArray: '6,4', fillColor: '#2563eb', fillOpacity: 0.06 } }
            ).addTo(map);
            try { map.fitBounds(state.bufferLayer.getBounds(), { padding: [40, 40] }); } catch (_) { }
        }

        // Vẽ thửa đất trong vùng
        const resGj = data.result_geojson;
        if (resGj && resGj.features && resGj.features.length > 0) {
            state.resultLayer = L.geoJSON(resGj, {
                style: f => ({
                    color: f.properties.vi_pham ? '#f43f5e' : '#10b981',
                    weight: 2.5,
                    fillOpacity: 0.35,
                    fillColor: f.properties.vi_pham ? '#f43f5e' : '#10b981',
                }),
                onEachFeature: (f, layer) => {
                    const p = f.properties;
                    layer.bindPopup(`
          <div style="font-family:'Be Vietnam Pro',sans-serif">
            <b style="font-size:13px">${p.ma_thua_dat || 'N/A'}</b>
            <div style="margin:6px 0">
              ${p.vi_pham
                            ? '<span style="color:#f43f5e;font-weight:600">⚠ Vi phạm quy hoạch</span>'
                            : '<span style="color:#10b981;font-weight:600">✓ Hợp lệ</span>'}
            </div>
            <div style="font-size:11px;color:#555">
              Loại đất: <b>${p.loai_dat || '—'}</b><br>
              Diện tích: ${p.dien_tich ? Number(p.dien_tich).toLocaleString() + ' m²' : '—'}<br>
              Chủ SD: ${p.chu_su_dung || '—'}
            </div>
          </div>
        `);
                },
            }).addTo(map);
        }

        // Cập nhật bubble
        document.getElementById('rb-title').textContent = `Buffer ${radius}m`;
        document.getElementById('rb-so-thua').textContent = `${data.so_thua_trong_vung || 0} thửa`;
        document.getElementById('rb-vi-pham').textContent = data.so_vi_pham > 0 ? `${data.so_vi_pham} thửa ⚠` : '0 thửa';
        document.getElementById('rb-dien-tich').textContent = data.tong_dien_tich ? `${Number(data.tong_dien_tich).toLocaleString()} m²` : '—';
        document.getElementById('rb-chu-su-dung').textContent = `${data.so_chu_su_dung || 0} người`;
        document.getElementById('result-bubble').style.display = 'block';

        state.lastResults = { ...data, type: 'buffer' };
        setStatus(`Hoàn thành — ${data.so_thua_trong_vung || 0} thửa | ${data.so_vi_pham || 0} vi phạm`, 'ready');
        showToast(
            'Buffer hoàn thành',
            `${data.so_thua_trong_vung || 0} thửa${data.so_vi_pham > 0 ? ` · ⚠ ${data.so_vi_pham} vi phạm` : ''}`,
            data.so_vi_pham > 0 ? 'warning' : 'success'
        );
        renderResultsPanel(data);
    }

    // ── 15. HIỂN THỊ KẾT QUẢ INTERSECT  (BUG FIX #2) ───────────
    function displayIntersectResult(data) {
        if (state.resultLayer) map.removeLayer(state.resultLayer);

        // BUG FIX #2: backend trả 'vi_pham_geojson' dạng object (không phải string)
        const gj = data.vi_pham_geojson;
        if (gj && gj.features && gj.features.length > 0) {
            state.resultLayer = L.geoJSON(gj, {
                style: { color: '#f43f5e', weight: 2.5, fillColor: '#f43f5e', fillOpacity: 0.35 },
                onEachFeature: (f, layer) => {
                    const p = f.properties;
                    layer.bindPopup(`
          <div style="font-family:'Be Vietnam Pro',sans-serif">
            <b>${p.ma_thua_dat || 'N/A'}</b>
            <div style="color:#f43f5e;font-weight:600;margin:4px 0">⚠ Vi phạm quy hoạch</div>
            <div style="font-size:11px;color:#555">
              Vùng QH: <b>${p.ten_vung_qh || '—'}</b><br>
              Diện tích VP: ${p.dien_tich_vi_pham ? Number(p.dien_tich_vi_pham).toLocaleString() + ' m²' : '—'}<br>
              Tỷ lệ: ${p.phan_tram ? p.phan_tram + '%' : '—'}
            </div>
          </div>
        `);
                },
            }).addTo(map);
            try {
                if (state.resultLayer.getBounds().isValid())
                    map.fitBounds(state.resultLayer.getBounds(), { padding: [40, 40] });
            } catch (_) { }
        } else {
            // Không có vi phạm → thông báo trên map
            showToast('Không có vi phạm', 'Tất cả thửa đất đều hợp lệ với quy hoạch', 'success');
        }

        // Bubble
        document.getElementById('rb-title').textContent = 'Vi phạm quy hoạch';
        document.getElementById('rb-so-thua').textContent = `${data.tong_kiem_tra || 0} thửa`;
        document.getElementById('rb-vi-pham').textContent = data.so_vi_pham > 0 ? `${data.so_vi_pham} thửa ⚠` : '0 thửa';
        document.getElementById('rb-dien-tich').textContent = data.tong_dien_tich ? `${Number(data.tong_dien_tich).toLocaleString()} m²` : '—';
        document.getElementById('rb-chu-su-dung').textContent = `${data.so_chu_su_dung || 0} người`;
        document.getElementById('result-bubble').style.display = 'block';

        state.lastResults = { ...data, type: 'intersect' };
        setStatus(`Kiểm tra xong — ${data.so_vi_pham || 0}/${data.tong_kiem_tra || 0} thửa vi phạm`, 'ready');
        showToast('Kiểm tra vi phạm', `${data.so_vi_pham || 0} thửa vi phạm`, data.so_vi_pham > 0 ? 'warning' : 'success');
        renderResultsPanel(data);
    }

    // ── 16. RENDER RESULTS PANEL ────────────────────────────────
    function renderResultsPanel(data) {
        const container = document.getElementById('results-container');
        const isVP = data.so_vi_pham !== undefined;
        const list = data.danh_sach || [];

        container.innerHTML = `
    <div class="result-card">
      <div class="rc-title"><i class="fa fa-chart-bar" style="color:var(--accent)"></i> Kết quả phân tích</div>
      ${data.so_thua_trong_vung !== undefined
                ? `<div class="rc-row"><div class="rc-label">Thửa trong vùng</div><div class="rc-value">${data.so_thua_trong_vung}</div></div>` : ''}
      ${data.tong_kiem_tra !== undefined
                ? `<div class="rc-row"><div class="rc-label">Tổng kiểm tra</div><div class="rc-value">${data.tong_kiem_tra}</div></div>` : ''}
      ${isVP
                ? `<div class="rc-row"><div class="rc-label">Vi phạm QH</div><div class="rc-value ${data.so_vi_pham > 0 ? 'rose' : 'emerald'}">${data.so_vi_pham} thửa</div></div>` : ''}
      ${data.tong_dien_tich
                ? `<div class="rc-row"><div class="rc-label">Tổng diện tích</div><div class="rc-value">${Number(data.tong_dien_tich).toLocaleString()} m²</div></div>` : ''}
      ${data.so_chu_su_dung !== undefined
                ? `<div class="rc-row"><div class="rc-label">Chủ sử dụng</div><div class="rc-value">${data.so_chu_su_dung} người</div></div>` : ''}
      <div class="result-actions">
        <button onclick="switchToResultsTab()">📋 Danh sách</button>
        <button onclick="exportExcel()">⬇ Xuất Excel</button>
      </div>
    </div>
    ${list.length > 0 ? renderParcelList(list) : ''}
  `;
    }

    function renderParcelList(list) {
        const rows = list.slice(0, 30).map(p => `
    <div class="rc-row" style="cursor:pointer" onclick="zoomToParcel(${p.id || 0})">
      <div class="rc-label">
        ${p.vi_pham ? '🔴' : '🟢'}
        <b>${p.ma_thua_dat || 'N/A'}</b>
        <span style="font-size:10px;color:var(--text-dim);margin-left:4px">${p.loai_dat || ''}</span>
        ${p.ten_vung_qh ? `<span style="font-size:10px;color:var(--rose);margin-left:4px">${p.ten_vung_qh}</span>` : ''}
      </div>
      <div class="rc-value" style="font-size:11px">${p.dien_tich ? Number(p.dien_tich).toLocaleString() + ' m²' : '—'}</div>
    </div>`).join('');
        return `
    <div class="result-card">
      <div class="rc-title"><i class="fa fa-list" style="color:var(--text-mid)"></i> Danh sách thửa (${list.length > 30 ? '30/' + list.length : list.length})</div>
      ${rows}
      ${list.length > 30 ? `<div style="text-align:center;font-size:11px;color:var(--text-dim);margin-top:8px">...và ${list.length - 30} thửa khác</div>` : ''}
    </div>`;
    }

    function zoomToParcel(id) {
        if (!state.resultLayer) return;
        state.resultLayer.eachLayer(layer => {
            if (layer.feature?.properties?.id === id) {
                try { map.fitBounds(layer.getBounds(), { padding: [30, 30] }); } catch (_) { }
                layer.openPopup();
            }
        });
    }

    // ── 17. XÓA KẾT QUẢ ─────────────────────────────────────────
    function clearAllResults() {
        [state.bufferMarker, state.bufferLayer, state.resultLayer, state.drawLayer].forEach(l => {
            if (l) try { map.removeLayer(l); } catch (_) { }
        });
        state.bufferMarker = state.bufferLayer = state.resultLayer = state.drawLayer = state.drawnPolygon = null;
        document.getElementById('result-bubble').style.display = 'none';
        document.getElementById('results-container').innerHTML = `
    <div class="empty-results"><i class="fa fa-chart-area"></i><span>Chạy phân tích để xem kết quả tại đây</span></div>`;
        setStatus('Đã xóa — Click bản đồ để đặt tâm buffer mới', 'ready');
    }

    function resetMapView() {
        map.setView([GIS_CONFIG.centerLat, GIS_CONFIG.centerLng], GIS_CONFIG.defaultZoom);
    }

    // ── 18. XUẤT EXCEL ───────────────────────────────────────────
    function exportExcel(type) {
        if (!state.lastResults && !type) {
            showToast('Chưa có dữ liệu', 'Vui lòng chạy phân tích trước', 'warning');
            return;
        }
        const t = type || state.lastResults?.type || 'buffer';
        const id = state.lastResults?.id || '';
        showToast('Đang xuất...', 'File Excel sẽ được tải xuống', 'success');
        window.location.href = `${GIS_CONFIG.apiExport}?type=${t}&id=${id}`;
    }

    // ── 19. LỊCH SỬ ──────────────────────────────────────────────
    function addHistoryEntry(name, meta, dotClass) {
        const list = document.getElementById('history-list');
        const empty = list.querySelector('.empty-results');
        if (empty) empty.remove();
        const now = new Date();
        const time = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
        const item = document.createElement('div');
        item.className = 'hist-item';
        item.innerHTML = `
    <div class="hist-dot ${dotClass}"></div>
    <div style="flex:1;min-width:0">
      <div class="hist-name">${name}</div>
      <div class="hist-meta">${meta}</div>
    </div>
    <div class="hist-time">${time}</div>`;
        list.insertBefore(item, list.firstChild);
        while (list.children.length > 20) list.removeChild(list.lastChild);
    }

    async function loadHistoryItem(id) {
        if (!id) return;
        showLoading('Tải lại phân tích...', `#${id}`);
        try {
            const res = await fetch(`${GIS_CONFIG.apiLichSu}${id}/`);
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || 'Không tìm thấy');
            const result = data.result || {};
            if (data.loai === 'buffer' || data.loai === 'vi_pham_quy_hoach') {
                // Reconstruct từ result đã lưu — chỉ hiển thị thống kê, không vẽ lại map
                document.getElementById('results-container').innerHTML = `
        <div class="result-card">
          <div class="rc-title"><i class="fa fa-history" style="color:var(--accent)"></i> ${data.ten}</div>
          <div class="rc-row"><div class="rc-label">Thời gian</div><div class="rc-value">${data.thoi_gian}</div></div>
          ${result.so_thua_trong_vung !== undefined
                        ? `<div class="rc-row"><div class="rc-label">Thửa trong vùng</div><div class="rc-value">${result.so_thua_trong_vung}</div></div>` : ''}
          ${result.so_vi_pham !== undefined
                        ? `<div class="rc-row"><div class="rc-label">Vi phạm</div><div class="rc-value ${result.so_vi_pham > 0 ? 'rose' : 'emerald'}">${result.so_vi_pham}</div></div>` : ''}
        </div>`;
                switchToResultsTab();
            }
            showToast('Đã tải lại', `Phân tích #${id}`, 'success');
        } catch (e) {
            showToast('Lỗi', e.message, 'error');
        } finally { hideLoading(); }
    }

    // ── 20. LAYER TOGGLES ────────────────────────────────────────
    function setLayerVisible(key, visible) {
        state.layerVisible[key] = visible;
        const layerMap = { 'thua-dat': state.thuaDatLayer, 'quy-hoach': state.quyHoachLayer };
        const layer = layerMap[key];
        if (!layer) return;
        if (visible) { if (!map.hasLayer(layer)) layer.addTo(map); }
        else { if (map.hasLayer(layer)) map.removeLayer(layer); }
    }

    function bindLayerToggles() {
        document.querySelectorAll('.layer-item[data-layer]').forEach(item => {
            item.addEventListener('click', () => {
                const key = item.dataset.layer;
                const chk = item.querySelector('.lc-check');
                const nm = item.querySelector('.lc-name');
                const isOn = chk.classList.contains('on');
                chk.classList.toggle('on', !isOn);
                chk.textContent = isOn ? '' : '✓';
                nm.classList.toggle('on', !isOn);
                setLayerVisible(key, !isOn);
                syncLegendToggle(key, !isOn);
            });
        });
        document.querySelectorAll('[data-layer-toggle]').forEach(item => {
            item.addEventListener('click', () => {
                const key = item.dataset.layerToggle;
                const chk = item.querySelector('.lc-check');
                const nm = item.querySelector('.ip-name');
                const isOn = chk.classList.contains('on');
                chk.classList.toggle('on', !isOn);
                chk.style.background = isOn ? 'var(--navy3)' : 'var(--accent)';
                chk.style.borderColor = isOn ? 'var(--border)' : 'var(--accent)';
                chk.textContent = isOn ? '' : '✓';
                nm.classList.toggle('on', !isOn);
                setLayerVisible(key, !isOn);
                syncSidebarToggle(key, !isOn);
            });
        });
    }

    function syncLegendToggle(key, visible) {
        const item = document.querySelector(`[data-layer-toggle="${key}"]`);
        if (!item) return;
        const chk = item.querySelector('.lc-check');
        const nm = item.querySelector('.ip-name');
        chk.classList.toggle('on', visible);
        chk.style.background = visible ? 'var(--accent)' : 'var(--navy3)';
        chk.style.borderColor = visible ? 'var(--accent)' : 'var(--border)';
        chk.textContent = visible ? '✓' : '';
        nm.classList.toggle('on', visible);
    }

    function syncSidebarToggle(key, visible) {
        const item = document.querySelector(`.layer-item[data-layer="${key}"]`);
        if (!item) return;
        const chk = item.querySelector('.lc-check');
        const nm = item.querySelector('.lc-name');
        chk.classList.toggle('on', visible);
        chk.textContent = visible ? '✓' : '';
        nm.classList.toggle('on', visible);
    }

    // ── 21. OPACITY SLIDERS ──────────────────────────────────────
    function bindOpacitySliders() {
        const sliders = document.querySelectorAll('.opacity-row input[type=range]');
        const keyMap = ['thua-dat', 'quy-hoach'];
        sliders.forEach((slider, i) => {
            slider.addEventListener('input', () => {
                const key = keyMap[i];
                const val = parseInt(slider.value) / 100;
                state.opacity[key] = val;
                slider.nextElementSibling.textContent = slider.value + '%';
                const layer = key === 'thua-dat' ? state.thuaDatLayer : state.quyHoachLayer;
                if (layer) layer.setStyle({ fillOpacity: val });
            });
        });
    }

    // ── 22. BASEMAP SWITCH ───────────────────────────────────────
    document.querySelectorAll('[id^="basemap-select"]').forEach(sel => {
        sel.addEventListener('change', function () {
            const next = BASEMAPS[this.value] || BASEMAPS.voyager;
            if (next === currentBasemap) return;
            map.removeLayer(currentBasemap);
            next.addTo(map);
            next.setZIndex(0);
            currentBasemap = next;
            document.querySelectorAll('[id^="basemap-select"]').forEach(s => s.value = this.value);
        });
    });

    // ── 23. ĐO LƯỜNG ─────────────────────────────────────────────
    let measurePoints = [], measurePolyline = null, measureMarkers = [];

    document.getElementById('btn-measure').addEventListener('click', () => {
        const btn = document.getElementById('btn-measure');
        if (state.isMeasuring) {
            state.isMeasuring = false;
            btn.classList.remove('active');
            map.off('click', onMeasureClick);
            map.getContainer().style.cursor = '';
            measurePoints = [];
            if (measurePolyline) { map.removeLayer(measurePolyline); measurePolyline = null; }
            measureMarkers.forEach(m => map.removeLayer(m));
            measureMarkers = [];
            setStatus('Kết thúc đo lường', 'ready');
        } else {
            state.isMeasuring = true;
            btn.classList.add('active');
            map.getContainer().style.cursor = 'crosshair';
            measurePoints = [];
            setStatus('Đo lường — Click để thêm điểm | Double-click để kết thúc', 'ready');
            map.on('click', onMeasureClick);
            map.once('dblclick', () => {
                state.isMeasuring = false;
                btn.classList.remove('active');
                map.off('click', onMeasureClick);
                map.getContainer().style.cursor = '';
                if (measurePoints.length >= 2) {
                    let total = 0;
                    for (let i = 1; i < measurePoints.length; i++) total += measurePoints[i - 1].distanceTo(measurePoints[i]);
                    showToast('Kết quả đo', `Khoảng cách: ${total >= 1000 ? (total / 1000).toFixed(2) + ' km' : total.toFixed(0) + ' m'}`, 'success');
                    setStatus(`Khoảng cách: ${total >= 1000 ? (total / 1000).toFixed(2) + ' km' : total.toFixed(0) + ' m'}`, 'ready');
                }
            });
        }
    });

    function onMeasureClick(e) {
        measurePoints.push(e.latlng);
        const mk = L.circleMarker(e.latlng, { radius: 4, color: '#f59e0b', fillColor: '#f59e0b', fillOpacity: 1, weight: 1 }).addTo(map);
        measureMarkers.push(mk);
        if (measurePolyline) map.removeLayer(measurePolyline);
        if (measurePoints.length >= 2) {
            measurePolyline = L.polyline(measurePoints, { color: '#f59e0b', weight: 2, dashArray: '4,4' }).addTo(map);
            let total = 0;
            for (let i = 1; i < measurePoints.length; i++) total += measurePoints[i - 1].distanceTo(measurePoints[i]);
            setStatus(`Tạm: ${total >= 1000 ? (total / 1000).toFixed(2) + ' km' : total.toFixed(0) + ' m'} — Dblclick để kết thúc`, 'ready');
        }
    }

    // ── 24. VẼ VÙNG PHÂN TÍCH ───────────────────────────────────
    document.getElementById('btn-draw').addEventListener('click', () => {
        const btn = document.getElementById('btn-draw');
        if (state.isDrawing) {
            state.isDrawing = false;
            btn.classList.remove('active');
            map.getContainer().style.cursor = '';
            setStatus('Kết thúc vẽ', 'ready');
            return;
        }
        state.isDrawing = true;
        btn.classList.add('active');
        map.getContainer().style.cursor = 'crosshair';
        if (state.drawLayer) { map.removeLayer(state.drawLayer); state.drawLayer = null; state.drawnPolygon = null; }
        const pts = [];
        setStatus('Vẽ vùng — Click để thêm điểm | Double-click để hoàn thành', 'ready');

        function onDrawClick(e) { pts.push(e.latlng); }
        map.on('click', onDrawClick);
        map.once('dblclick', () => {
            state.isDrawing = false;
            btn.classList.remove('active');
            map.off('click', onDrawClick);
            map.getContainer().style.cursor = '';
            if (pts.length >= 3) {
                state.drawLayer = L.polygon(pts, { color: '#8b5cf6', weight: 2, dashArray: '4,4', fillColor: '#8b5cf6', fillOpacity: 0.1 }).addTo(map);
                state.drawnPolygon = state.drawLayer;
                setStatus(`Vùng phân tích đã vẽ — ${pts.length} điểm`, 'ready');
                showToast('Vùng đã vẽ', 'Dùng cho kiểm tra vi phạm theo khu vực', 'success');
            }
        });
    });

    // ── 25. SIDEBAR TABS ─────────────────────────────────────────
    document.querySelectorAll('.s-tab').forEach(tab => {
        tab.addEventListener('click', () => {
            document.querySelectorAll('.s-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
            tab.classList.add('active');
            document.getElementById('tab-' + tab.dataset.tab).classList.add('active');
        });
    });

    function switchToResultsTab() {
        document.querySelectorAll('.s-tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
        document.querySelector('[data-tab="results"]').classList.add('active');
        document.getElementById('tab-results').classList.add('active');
    }

    // ── 26. TOOL GROUP TOGGLE ────────────────────────────────────
    document.querySelectorAll('.tg-header').forEach(header => {
        header.addEventListener('click', () => {
            const body = document.getElementById('group-' + header.dataset.group);
            const arrow = header.querySelector('.tg-arrow');
            if (!body) return;
            const open = body.style.display !== 'none';
            body.style.display = open ? 'none' : 'block';
            arrow.classList.toggle('open', !open);
        });
    });

    // ── 27. TOOL ITEM SELECT ─────────────────────────────────────
    const STATUS_MAP = {
        'buffer-click': 'Click trên bản đồ để đặt tâm buffer',
        'buffer-parcel': 'Nhập mã thửa đất để tạo buffer',
        'intersect': 'Chọn phạm vi và nhấn "Kiểm tra vi phạm"',
        'clip': 'Chọn vùng quy hoạch và nhấn "Clip dữ liệu"',
        'stats-area': 'Nhấn "Tính thống kê" để xem kết quả',
        'density': 'Nhấn "Tạo bản đồ mật độ"',
    };
    document.querySelectorAll('.tool-item').forEach(item => {
        item.addEventListener('click', () => {
            document.querySelectorAll('.tool-item').forEach(t => t.classList.remove('active'));
            item.classList.add('active');
            state.activeTool = item.dataset.tool;
            document.querySelectorAll('.params-panel').forEach(p => p.style.display = 'none');
            const pid = item.dataset.params;
            if (pid) document.getElementById(pid).style.display = 'block';
            setStatus(STATUS_MAP[state.activeTool] || 'Sẵn sàng', 'ready');
        });
    });

    // ── 28. PRESET RADIUS ────────────────────────────────────────
    document.querySelectorAll('.preset-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById('radius-val').value = btn.dataset.r;
        });
    });

    // ── 29. COORDINATE & ZOOM ────────────────────────────────────
    map.on('mousemove', e => {
        document.getElementById('coord-display').textContent =
            e.latlng.lng.toFixed(4) + '° E  |  ' + e.latlng.lat.toFixed(4) + '° N';
    });
    map.on('zoomend', () => {
        document.getElementById('zoom-level').textContent = map.getZoom();
    });

    // ── 30. UI HELPERS ───────────────────────────────────────────
    function setStatus(msg, type) {
        document.getElementById('status-text').textContent = msg;
        document.getElementById('status-dot').className = 'sb-dot ' + (type || 'ready');
    }
    function showLoading(title, sub) {
        document.getElementById('loading-text').textContent = title || 'Đang xử lý...';
        document.getElementById('loading-sub').textContent = sub || '';
        document.getElementById('loading-overlay').style.display = 'flex';
    }
    function hideLoading() {
        document.getElementById('loading-overlay').style.display = 'none';
    }
    function showToast(title, msg, type) {
        const icons = { success: '✅', error: '❌', warning: '⚠️', info: 'ℹ️' };
        const el = document.createElement('div');
        el.className = `toast ${type || 'success'}`;
        el.innerHTML = `<div class="toast-icon">${icons[type] || 'ℹ️'}</div>
    <div class="toast-body"><div class="toast-title">${title}</div><div class="toast-msg">${msg}</div></div>`;
        document.getElementById('toast-container').appendChild(el);
        setTimeout(() => el.remove(), 4500);
    }
    function apiFetch(url, body) {
        return fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-CSRFToken': GIS_CONFIG.csrfToken },
            body: JSON.stringify(body),
        });
    }
