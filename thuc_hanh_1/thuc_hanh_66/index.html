<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Leaflet-Geoman</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.2/dist/leaflet.css"/>
    <link rel="stylesheet" href="https://unpkg.com/@geoman-io/leaflet-geoman-free@latest/dist/leaflet-geoman.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
    <script src="https://unpkg.com/leaflet@1.9.2/dist/leaflet.js"></script>
    <script src="https://unpkg.com/@geoman-io/leaflet-geoman-free@latest/dist/leaflet-geoman.min.js"></script>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <!-- Custom Toolbar -->
    <div class="custom-toolbar">
        <div class="toolbar-section">
            <button class="tool-btn active" id="tool-pan" title="Di chuyển bản đồ (Pan)">
                <i class="fas fa-hand-paper"></i>
            </button>
            <button class="tool-btn" id="tool-locate" title="Định vị vị trí của bạn">
                <i class="fas fa-crosshairs"></i>
            </button>
        </div>
        <div class="toolbar-divider"></div>
        <div class="toolbar-section">
            <button class="tool-btn" id="tool-marker" title="Thêm điểm đánh dấu">
                <i class="fas fa-map-marker-alt"></i>
            </button>
            <button class="tool-btn" id="tool-polyline" title="Vẽ đường thẳng">
                <i class="fas fa-pen"></i>
            </button>
            <button class="tool-btn" id="tool-polygon" title="Vẽ đa giác">
                <i class="fas fa-draw-polygon"></i>
            </button>
            <button class="tool-btn" id="tool-circle" title="Vẽ hình tròn">
                <i class="far fa-circle"></i>
            </button>
            <button class="tool-btn" id="tool-rectangle" title="Vẽ hình chữ nhật">
                <i class="far fa-square"></i>
            </button>
            <button class="tool-btn" id="tool-circlemarker" title="Vẽ điểm tròn">
                <i class="fas fa-dot-circle"></i>
            </button>
        </div>
        <div class="toolbar-divider"></div>
        <div class="toolbar-section">
            <button class="tool-btn" id="tool-measure-distance" title="Đo khoảng cách">
                <i class="fas fa-ruler"></i>
            </button>
            <button class="tool-btn" id="tool-measure-area" title="Đo diện tích">
                <i class="fas fa-ruler-combined"></i>
            </button>
        </div>
        <div class="toolbar-divider"></div>
        <div class="toolbar-section">
            <button class="tool-btn" id="tool-edit" title="Chỉnh sửa đối tượng">
                <i class="fas fa-edit"></i>
            </button>
            <button class="tool-btn" id="tool-drag" title="Kéo thả đối tượng">
                <i class="fas fa-arrows-alt"></i>
            </button>
            <button class="tool-btn" id="tool-cut" title="Cắt đối tượng">
                <i class="fas fa-cut"></i>
            </button>
            <button class="tool-btn" id="tool-delete" title="Xóa đối tượng">
                <i class="fas fa-trash-alt"></i>
            </button>
        </div>
        <div class="toolbar-divider"></div>
        <div class="toolbar-section">
            <button class="tool-btn" id="tool-undo" title="Hoàn tác (Undo)">
                <i class="fas fa-undo"></i>
            </button>
            <button class="tool-btn" id="tool-redo" title="Làm lại (Redo)">
                <i class="fas fa-redo"></i>
            </button>
            <button class="tool-btn" id="tool-clear" title="Xóa tất cả">
                <i class="fas fa-trash"></i>
            </button>
            <button class="tool-btn" id="tool-reset" title="Reset bản đồ">
                <i class="fas fa-sync-alt"></i>
            </button>
        </div>
    </div>
    <div id="map"></div>
    <!-- Measurement Info Panel -->
    <div class="measurement-info" id="measurement-info" style="display: none;">
        <span id="measurement-text"></span>
        <button id="close-measurement"><i class="fas fa-times"></i></button>
    </div>

    <script src="script.js"></script>
</body>
</html>
